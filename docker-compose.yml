    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      routing:
        condition: service_healthy
      mitm:
        condition: service_healthy
    environment:
      PG_HOST: postgres
      PG_PORT: 5432
      PG_DB: stegnar
      PG_USER: stegnar
      PG_PASS: stegnar_secret
      REDIS_HOST: redis
      REDIS_PORT: 6379
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS: stegnar
      MINIO_SECRET: stegnar_minio_secret
      SOC_API_TEMP_DIR: /tmp/stegnar-soc
      # Use exec into the existing MITM container instead of creating ephemeral containers.
      # Ephemeral container creation may fail due to Compose network name prefixes
      # (e.g. stegnar_prototype_stegnar-net). Use exec mode for more reliable runs.
      INGEST_EPHEMERAL: "false"
      INGEST_TIMEOUT_SEC: "300"
    ports:
      - "3001:3001"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${RUNTIME_DIR:-./runtime/current}/logs:/var/log/stegnar
      - ${RUNTIME_DIR:-./runtime/current}/soc-api-tmp:/tmp/stegnar-soc
    networks:
      - stegnar-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:3001/api/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 20

  soc-frontend:
    build:
      context: .
      dockerfile: frontend.Dockerfile
    container_name: stegnar-soc-frontend
    depends_on:
      soc-api:
        condition: service_healthy
    ports:
      - "3000:80"
    networks:
      - stegnar-net
    restart: unless-stopped

# ===========================================================================
# Shared network and volumes
# ===========================================================================

networks:
  stegnar-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/24
